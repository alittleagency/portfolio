<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demos · Brittany May</title>
<meta name="description" content="Working demos of dashboards, apps, and tools Brittany May builds for nonprofits, small businesses, and firms.">
<meta property="og:title" content="Demos · Brittany May"><meta property="og:image" content="og.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#8c3b20;--soft:#665f58;--cream:#FBF4EC;--paper:#FFFCF8;--line:#DDD5C8;--green:#a3472a;--mint:#f1ddd2}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--mint)}
a{color:inherit}:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100vh}
aside{background:var(--paper);border-right:2px solid var(--ink);display:flex;flex-direction:column;overflow-y:auto}
.top{padding:22px 22px 8px}
.home{font-weight:800;font-size:19px;text-decoration:none}
.back{display:inline-block;margin-top:6px;font-size:14px;color:var(--soft);font-weight:600;text-decoration:none}.back:hover{color:var(--ink)}
nav{padding:4px 12px 20px}
.grp{font-size:14px;font-weight:800;color:var(--green);margin:20px 10px 6px}
nav button{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--ink);font-weight:700;line-height:1.3}
nav button small{display:block;color:var(--soft);font-weight:500;font-size:13px;margin-top:2px}
nav button:hover{background:#F3ECE1}nav button[aria-current=true]{background:var(--mint)}
.cta-side{margin:auto 22px 22px;padding:16px;border:2px solid var(--ink);border-radius:14px;background:#fff}
.cta-side b{display:block;font-size:15px}.cta-side p{margin:4px 0 10px;font-size:14px;color:var(--soft)}
.btn{display:inline-block;background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.g{background:transparent;color:var(--ink)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:16px 22px;border-bottom:2px solid var(--ink);background:var(--paper)}
.bar h1{font-size:22px;margin:0;letter-spacing:-.01em}
.bar p{margin:3px 0 0;color:var(--soft);font-size:15px;max-width:640px}
.bar p b{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stage{flex:1;min-height:0;padding:14px;background:var(--cream)}
iframe{width:100%;height:100%;border:2px solid var(--ink);border-radius:14px;background:#fff;display:block}
.pick{display:none}
@media(max-width:860px){
 .app{display:block;height:auto}aside{border-right:0;border-bottom:2px solid var(--ink)}
 nav,.cta-side{display:none}.pick{display:block;padding:0 22px 18px}
 .pick select{width:100%;font:inherit;font-weight:700;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
 .stage{height:auto;padding:10px}
 iframe{height:88vh;min-height:620px}
}
</style><style id="nobreak">p,li,dd,blockquote,figcaption,label,td{text-wrap:pretty}h1,h2,h3,h4,h5,.cta,button,a.btn{text-wrap:balance}</style><style id="rust-text">body{color:#1f1a17!important}h1,h2,h3,nav button,.bar p b,input,textarea,select{color:#1f1a17}</style></head><body>
<div class="app">
<aside><div class="top"><a class="home" href="index.html">Brittany May.</a><br><a class="back" href="index.html">Back to home</a></div>
<div class="pick"><label for="sel" style="font-size:14px;font-weight:700;color:var(--soft)">Pick a demo</label><select id="sel"></select></div>
<nav id="nav" aria-label="Demos"></nav>
<div class="cta-side"><b>Want one like this?</b><p>Start with a free Systems Snapshot. <span class="keep">It takes about 5 minutes.</span></p><a class="btn" href="start.html">Work with me</a></div></aside>
<main><div class="bar"><div><h1 id="t"></h1><p id="d"></p></div><div class="acts"><a class="btn g" id="full" target="_blank" rel="noopener">Full screen</a><a class="btn" href="start.html">Work with me</a></div></div>
<div class="stage"><iframe id="f" title="Demo"></iframe></div></main></div>
<script>
const G=[["Dashboards",[
 ["nonprofit","nonprofit-impact.html","Nonprofit Impact Dashboard","Donors, sponsors, volunteers, events","Donor, volunteer, and event numbers lived in different spreadsheets.","one dashboard with who to thank, a sponsor pipeline, and a board report you can print."],
 ["impact","impact-dashboard.html","Client Impact Tracker","First meeting to funded","Client progress was tracked in notes and memory.","a tracker from first meeting to funded, with email drafts and an impact report that writes itself."]]],
 ["Apps",[
 ["detailing","service-business.html","Shine & Go Detailing","Booking, schedule, and payments","A service business juggled bookings by text and payments by memory.","online booking with instant prices, plus the owner's schedule, crew, clients, and who still owes."],
 ["housing","housing-tracker.html","Willow Lane Homes","Waitlist to move-in","Applicants, homes, and donors were tracked in three separate places.","one board from application to move-in, a view of every home and open bed, and funding by home."],
 ["time","time-expense.html","Time & Expense","Timesheets to invoices","Timesheets and receipts came in by email and became invoices by hand.","logging, approvals, receipts, and one-click invoices from approved work."]]],
 ["Quick tools",[
 ["ai","ai-review.html","AI Time Review","Find hours AI can save","Owners know AI could help but not where to start.","five questions that turn into a plan with tools, costs, and a 30-day start."],
 ["navigator","resource-navigator.html","Resource Navigator","Match people to the right help","Staff spent hours figuring out which partner fits each business owner.","four questions that match people to the right help, with a take-home plan."],
 ["cleanup","follow-through.html","Sign-up Cleanup","Messy lists to follow-ups","Event sign-ups came in three messy lists and nobody got followed up with.","one clean list with a follow-up for every person and a report for leadership."],
 ["contract","contract-ready.html","Contract-Ready Check","What's missing to sell to government","Small businesses don't know what they need to win government work.","a checklist of what's missing and which contracts to go after now."]]]];
const all=G.flatMap(g=>g[1]);
const $=s=>document.querySelector(s);
$("#nav").innerHTML=G.map(([g,L])=>`<div class="grp">${g}</div>`+L.map(d=>`<button data-id="${d[0]}">${d[2]}<small>${d[3]}</small></button>`).join("")).join("");
$("#sel").innerHTML=G.map(([g,L])=>`<optgroup label="${g}">${L.map(d=>`<option value="${d[0]}">${d[2]}</option>`).join("")}</optgroup>`).join("");
function show(id,push){const d=all.find(x=>x[0]===id)||all.find(x=>x[0]==="detailing");
 $("#t").textContent=d[2];$("#d").innerHTML="<b>The problem:</b> "+d[4]+" <b>What I built:</b> "+d[5];
 $("#f").src="demos/"+d[1];$("#full").href="demos/"+d[1];$("#sel").value=d[0];
 document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.id===d[0]));
 document.title=d[2]+" · Demos · Brittany May";if(push)history.replaceState(null,"","#"+d[0])}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.id,1)});
$("#sel").addEventListener("change",e=>show(e.target.value,1));
addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script><style id="btn-eq">.bar .btn{min-width:150px;text-align:center}@media(max-width:560px){.bar>div:last-child,.bar .acts{display:flex;width:100%;gap:8px}.bar .btn{flex:1 1 0;min-width:0}}</style><style id="wrap-final">*{text-wrap-style:auto!important}.keep{white-space:nowrap!important;text-wrap-mode:nowrap!important}</style></body></html>
